name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff4d2e&color_dots=#ebedf0,#ffd9cf,#ffa38f,#ff6f52,#d23a1c
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff4d2e&color_dots=#161b22,#3b1d17,#7a2a1a,#c93a20,#ff4d2e

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
